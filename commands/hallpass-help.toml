description = "Quick reference for hallpass commands and how to install its hooks"
prompt = "Show the hallpass quick reference. One shot, change nothing. Hallpass compiles AGENTS.md/CLAUDE.md/.cursor/rules/.github/copilot-instructions.md into enforceable policy and checks diffs and shell commands against it. Core commands: hallpass scan (discover instructions), hallpass rules (list approved policy rules), hallpass check [--staged] (check changes against policy), hallpass ci --base <ref> (CI completion gate), hallpass explain <ruleId> (why a rule fired), hallpass context <path> (effective policy for a path), hallpass conflicts (contradictory instructions), hallpass doctor (repo policy health), hallpass allow <ruleId> --reason \"...\" (record a human approval, never run by an agent), hallpass audit (local audit log), hallpass install claude|cursor|all (wire native pre-tool hooks into .claude/settings.json or .cursor/hooks.json). Exit codes: 0 pass, 1 violation, 2 config error, 3 engine failure, 4 approval required, 5 unresolved conflict."
